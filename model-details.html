<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porsche Model Details</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* Specific styles for details page */
        .detail-hero {
            height: 60vh;
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            align-items: flex-end;
            padding: 3rem 5%;
        }

        .detail-hero::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
        }

        .detail-content {
            position: relative;
            z-index: 10;
            width: 100%;
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .detail-header h1 {
            font-size: 4rem;
            margin: 0;
            line-height: 1;
        }

        .detail-price {
            font-size: 2rem;
            color: var(--primary-color);
            font-weight: 700;
        }

        .specs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
            padding: 3rem 5%;
            background-color: var(--card-bg);
            border-radius: 15px;
        }

        .spec-item {
            text-align: center;
            padding: 1rem;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .spec-item:last-child {
            border-right: none;
        }

        .spec-value {
            font-size: 2.5rem;
            font-weight: 700;
            display: block;
            margin-bottom: 0.5rem;
        }

        .spec-label {
            color: var(--secondary-text);
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 2rem;
            color: var(--secondary-text);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        .back-btn:hover {
            color: var(--text-color);
        }

        .container {
            padding: 0 5%;
            max-width: 1400px;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <header style="min-height: auto; background: none;">
        <nav style="position: relative; background: rgba(0,0,0,0.8);">
            <div class="logo">PORSCHE</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#models">Models</a></li>
            </ul>
        </nav>
    </header>

    <main id="detail-main">
        <!-- Content injected by JS -->
    </main>

    <footer>
        <p>&copy; 2024 Porsche. All rights reserved.</p>
    </footer>

    <script src="models.js"></script>
    <script src="details.js"></script>
</body>

</html>
