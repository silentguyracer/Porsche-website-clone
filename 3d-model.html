<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porsche - 3D Experience</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        .controls-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px 30px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
        }

        .control-btn {
            background: transparent;
            border: 1px solid #fff;
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: all 0.3s;
        }

        .control-btn:hover {
            background: #fff;
            color: #000;
        }

        .back-link {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #fff;
            text-decoration: none;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            font-weight: bold;
        }

        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #d5001c;
            font-size: 2rem;
            z-index: 200;
            transition: opacity 0.5s;
        }
    </style>
</head>

<body>
    <div id="loading-screen">LOADING 3D EXPERIENCE...</div>

    <a href="#" id="back-btn" class="back-link">&larr; Back to Details</a>

    <div id="canvas-container"></div>

    <div class="controls-overlay">
        <button class="control-btn" id="auto-rotate-btn">Stop Rotation</button>
        <button class="control-btn" id="reset-view-btn">Reset View</button>
    </div>

    <!-- Models Data -->
    <script src="models.js"></script>

    <!-- 3D Logic -->
    <script type="module" src="3d-viewer.js"></script>
</body>

</html>
